name: Build & Release Please v6

# This workflow builds single-file executables for all platforms
# and creates GitHub releases with downloadable binaries

on:
  push:
    branches: [ master, main, v2 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main, v2 ]

env:
  DOTNET_VERSION: '8.0.x'
  CONFIGURATION: Release
  
permissions:
  contents: write

jobs:
  ################################################################################
  # Build Matrix - Creates single-file executables for all platforms
  ################################################################################
  build:
    strategy:
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            runtime: win-x64
            artifact-name: please-windows-x64
            executable: please.exe
          - os: windows-latest
            runtime: win-arm64
            artifact-name: please-windows-arm64
            executable: please.exe
            
          # Linux builds  
          - os: ubuntu-latest
            runtime: linux-x64
            artifact-name: please-linux-x64
            executable: please
          - os: ubuntu-latest
            runtime: linux-arm64
            artifact-name: please-linux-arm64
            executable: please
            
          # macOS builds
          - os: macos-latest
            runtime: osx-x64
            artifact-name: please-macos-x64
            executable: please
          - os: macos-latest
            runtime: osx-arm64
            artifact-name: please-macos-arm64
            executable: please

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/Presentation/Please.Console/Please.Console.csproj

      - name: Build and publish single-file executable
        run: |
          dotnet publish src/Presentation/Please.Console/Please.Console.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            --output ./publish \
            /p:PublishAot=true \
            /p:PublishTrimmed=true \
            /p:TrimMode=link \
            /p:AssemblyName=please

      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir ./artifact
          copy "./publish/${{ matrix.executable }}" "./artifact/${{ matrix.executable }}"
        shell: cmd

      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p ./artifact
          cp "./publish/${{ matrix.executable }}" "./artifact/${{ matrix.executable }}"
          chmod +x "./artifact/${{ matrix.executable }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ./artifact/${{ matrix.executable }}
          if-no-files-found: error

      - name: Test executable (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ./artifact/${{ matrix.executable }} --version
          ./artifact/${{ matrix.executable }} --help

      - name: Test executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          ./artifact/${{ matrix.executable }} --version
          ./artifact/${{ matrix.executable }} --help
        shell: cmd

  ################################################################################
  # Release Job - Only runs on version tags
  ################################################################################
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Prepare release assets
        run: |
          mkdir -p ./release-assets
          
          # Windows x64
          cp ./dist/please-windows-x64/please.exe ./release-assets/please-windows-x64.exe
          
          # Windows ARM64
          cp ./dist/please-windows-arm64/please.exe ./release-assets/please-windows-arm64.exe
          
          # Linux x64
          cp ./dist/please-linux-x64/please ./release-assets/please-linux-x64
          chmod +x ./release-assets/please-linux-x64
          
          # Linux ARM64
          cp ./dist/please-linux-arm64/please ./release-assets/please-linux-arm64
          chmod +x ./release-assets/please-linux-arm64
          
          # macOS x64
          cp ./dist/please-macos-x64/please ./release-assets/please-macos-x64
          chmod +x ./release-assets/please-macos-x64
          
          # macOS ARM64
          cp ./dist/please-macos-arm64/please ./release-assets/please-macos-arm64
          chmod +x ./release-assets/please-macos-arm64

      - name: Generate release notes
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "# Please $TAG_NAME" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "🤖 **AI-Powered Script Generator - Single-File Executables**" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "**Built from commit \`${{ github.sha }}\`**" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## ⬇️ Downloads" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Windows" >> RELEASE_NOTES.md
          echo "- **please-windows-x64.exe** - Windows 10/11 (Intel/AMD 64-bit)" >> RELEASE_NOTES.md
          echo "- **please-windows-arm64.exe** - Windows 11 (ARM64)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Linux" >> RELEASE_NOTES.md  
          echo "- **please-linux-x64** - Linux (Intel/AMD 64-bit)" >> RELEASE_NOTES.md
          echo "- **please-linux-arm64** - Linux (ARM64)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### macOS" >> RELEASE_NOTES.md
          echo "- **please-macos-x64** - macOS Intel (x64)" >> RELEASE_NOTES.md
          echo "- **please-macos-arm64** - macOS Apple Silicon (M1/M2/M3)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 🚀 Quick Start" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "1. **Download** the appropriate executable for your platform" >> RELEASE_NOTES.md
          echo "2. **Run it** - On first run, it will offer to install itself to your system" >> RELEASE_NOTES.md
          echo "3. **Use it** - Generate scripts with natural language!" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "\`\`\`bash" >> RELEASE_NOTES.md
          echo "# Examples:" >> RELEASE_NOTES.md
          echo "./please get current time" >> RELEASE_NOTES.md
          echo "./please list running services" >> RELEASE_NOTES.md
          echo "./please create backup script for my documents" >> RELEASE_NOTES.md
          echo "\`\`\`" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## ✨ Features" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "- 🎯 **Single-file executables** - No installation required" >> RELEASE_NOTES.md
          echo "- 🏠 **Auto-installation** - Optionally install to system on first run" >> RELEASE_NOTES.md
          echo "- 📁 **Platform-consistent storage** - Data stored in appropriate locations" >> RELEASE_NOTES.md
          echo "- 🤖 **5 AI Providers** - OpenAI, Anthropic, Gemini, OpenRouter, Ollama" >> RELEASE_NOTES.md
          echo "- 🎨 **Syntax highlighting** - Beautiful PowerShell script display" >> RELEASE_NOTES.md
          echo "- 🔍 **Script validation** - Built-in PowerShell AST validation" >> RELEASE_NOTES.md
          echo "- ⚡ **Native AOT** - Fast startup, minimal dependencies" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 🔧 System Requirements" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "- **Windows**: Windows 10 version 1607+ or Windows 11" >> RELEASE_NOTES.md
          echo "- **Linux**: Most distributions (glibc 2.17+ or musl)" >> RELEASE_NOTES.md
          echo "- **macOS**: macOS 10.15+ (Catalina)" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Please ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            ./release-assets/please-windows-x64.exe
            ./release-assets/please-windows-arm64.exe
            ./release-assets/please-linux-x64
            ./release-assets/please-linux-arm64
            ./release-assets/please-macos-x64
            ./release-assets/please-macos-arm64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ################################################################################
  # Cleanup artifacts to save storage
  ################################################################################
  cleanup:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            please-windows-x64
            please-windows-arm64
            please-linux-x64
            please-linux-arm64
            please-macos-x64
            please-macos-arm64
          failOnError: false